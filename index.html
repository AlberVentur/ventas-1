<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Football Challenge</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#101820;

    font-family:Arial,sans-serif;

    touch-action:none;
}

body{

    display:flex;

    justify-content:center;

    align-items:center;
}

#game{

    position:relative;

    width:100vw;
    height:100vh;

    max-width:500px;

    overflow:hidden;

    background:#228b45;
}


/* =========================
   ESTADIO
========================= */

#field{

    position:absolute;

    inset:0;

    background:

    repeating-linear-gradient(
        90deg,
        #218b43 0px,
        #218b43 45px,
        #258f47 45px,
        #258f47 90px
    );
}


/* LÍNEAS DEL CAMPO */

#line1{

    position:absolute;

    top:15%;

    left:8%;

    width:84%;

    height:70%;

    border:
    3px solid
    rgba(255,255,255,.85);
}

#centerLine{

    position:absolute;

    top:50%;

    left:8%;

    width:84%;

    height:3px;

    background:white;
}


/* =========================
   PÚBLICO
========================= */

#stadium{

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:22%;

    background:
    linear-gradient(
        #192532,
        #34495e
    );

    overflow:hidden;
}

.crowd{

    position:absolute;

    bottom:0;

    width:100%;

    height:70%;

    background:

    radial-gradient(
        circle,
        #eee 2px,
        transparent 3px
    );

    background-size:14px 14px;

    opacity:.8;
}


/* =========================
   MARCADOR
========================= */

#scoreboard{

    position:absolute;

    top:15px;

    left:5%;

    width:90%;

    height:70px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:10px 15px;

    border-radius:18px;

    background:
    rgba(8,15,25,.92);

    color:white;

    z-index:20;

    box-shadow:
    0 5px 15px
    rgba(0,0,0,.4);
}

.team{

    display:flex;

    flex-direction:column;

    align-items:center;

    font-weight:bold;

    font-size:13px;
}

.blue{

    color:#2d8cff;
}

.red{

    color:#ff4a4a;
}

#score{

    font-size:30px;

    font-weight:bold;
}

#level{

    position:absolute;

    top:92px;

    left:50%;

    transform:translateX(-50%);

    padding:7px 18px;

    border-radius:20px;

    background:
    rgba(0,0,0,.65);

    color:white;

    font-weight:bold;

    z-index:20;
}


/* =========================
   PORTERÍA
========================= */

#goal{

    position:absolute;

    top:23%;

    left:12%;

    width:76%;

    height:19%;

    border:
    7px solid white;

    border-bottom:
    12px solid white;

    background:

    repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 18px,
        rgba(255,255,255,.35) 19px,
        transparent 20px
    ),

    repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 18px,
        rgba(255,255,255,.35) 19px,
        transparent 20px
    );

    z-index:5;
}


/* =========================
   PORTERO
========================= */

#goalkeeper{

    position:absolute;

    top:30%;

    left:50%;

    transform:
    translateX(-50%);

    width:45px;

    height:70px;

    border-radius:18px;

    background:#19a85b;

    z-index:10;

    box-shadow:
    0 5px 10px
    rgba(0,0,0,.4);

    transition:left .1s linear;
}

#goalkeeper:before{

    content:"";

    position:absolute;

    top:-25px;

    left:9px;

    width:27px;

    height:27px;

    border-radius:50%;

    background:#d79b73;
}

#goalkeeper:after{

    content:"";

    position:absolute;

    top:20px;

    left:-20px;

    width:85px;

    height:15px;

    background:#19a85b;

    border-radius:20px;
}


/* =========================
   JUGADOR
========================= */

#player{

    position:absolute;

    bottom:18%;

    left:50%;

    transform:
    translateX(-50%);

    width:55px;

    height:95px;

    z-index:12;
}

.body{

    position:absolute;

    bottom:0;

    left:9px;

    width:37px;

    height:60px;

    border-radius:14px;

    background:#1675e8;
}

.head{

    position:absolute;

    top:0;

    left:14px;

    width:27px;

    height:27px;

    border-radius:50%;

    background:#c98964;
}

.number{

    position:absolute;

    top:27px;

    left:13px;

    color:white;

    font-weight:bold;

    font-size:18px;
}


/* =========================
   BALÓN
========================= */

#ball{

    position:absolute;

    bottom:17%;

    left:50%;

    width:25px;

    height:25px;

    transform:
    translateX(-50%);

    border-radius:50%;

    background:white;

    border:
    2px solid #222;

    z-index:15;

    transition:
    left .12s linear,
    bottom .12s linear;
}


/* =========================
   GUÍA DE DISPARO
========================= */

#aim{

    position:absolute;

    bottom:29%;

    left:50%;

    width:5px;

    height:160px;

    background:
    rgba(255,255,255,.65);

    transform-origin:
    bottom center;

    transform:
    translateX(-50%)
    rotate(0deg);

    border-radius:10px;

    z-index:8;

    pointer-events:none;
}


/* =========================
   CONTROLES
========================= */

#controls{

    position:absolute;

    bottom:3%;

    left:0;

    width:100%;

    display:flex;

    justify-content:
    space-around;

    align-items:center;

    z-index:30;
}

.control{

    width:75px;

    height:75px;

    border-radius:50%;

    border:
    3px solid
    rgba(255,255,255,.5);

    background:
    rgba(0,0,0,.55);

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    font-size:12px;

    font-weight:bold;

    user-select:none;
}

.shoot{

    width:90px;

    height:90px;

    background:
    rgba(0,100,255,.8);

    font-size:15px;
}


/* =========================
   OBJETIVO
========================= */

#mission{

    position:absolute;

    bottom:15%;

    left:50%;

    transform:
    translateX(-50%);

    color:white;

    background:
    rgba(0,0,0,.55);

    padding:7px 15px;

    border-radius:20px;

    font-weight:bold;

    z-index:20;
}


/* =========================
   MENÚ
========================= */

#menu{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        rgba(0,0,0,.55),
        rgba(0,0,0,.75)
    );

    z-index:100;
}

.card{

    width:85%;

    max-width:350px;

    padding:30px 20px;

    text-align:center;

    border-radius:25px;

    background:
    rgba(10,18,25,.96);

    color:white;
}

.card h1{

    font-size:32px;

    margin-bottom:15px;
}

.card p{

    color:#ddd;

    margin-bottom:25px;

    line-height:1.5;
}

#play{

    padding:15px 40px;

    border:0;

    border-radius:30px;

    background:#1683ff;

    color:white;

    font-size:18px;

    font-weight:bold;
}


/* =========================
   MENSAJE
========================= */

#message{

    position:absolute;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    background:
    rgba(0,0,0,.7);

    z-index:90;
}

.messageBox{

    width:80%;

    padding:30px;

    background:#101820;

    border-radius:20px;

    text-align:center;

    color:white;
}

.messageBox h2{

    font-size:30px;

    margin-bottom:15px;
}

.messageBox button{

    margin-top:20px;

    padding:13px 25px;

    border:0;

    border-radius:20px;

    background:#1683ff;

    color:white;

    font-weight:bold;
}

</style>

</head>

<body>

<div id="game">

<div id="field"></div>

<div id="stadium">
<div class="crowd"></div>
</div>

<div id="line1"></div>

<div id="centerLine"></div>


<!-- MARCADOR -->

<div id="scoreboard">

<div class="team blue">
TÚ
<span>🔵</span>
</div>

<div id="score">
0 - 0
</div>

<div class="team red">
RIVAL
<span>🔴</span>
</div>

</div>


<div id="level">
NIVEL 1
</div>


<!-- PORTERÍA -->

<div id="goal"></div>

<div id="goalkeeper"></div>


<!-- JUGADOR -->

<div id="player">

<div class="head"></div>

<div class="body"></div>

<div class="number">
10
</div>

</div>


<!-- BALÓN -->

<div id="ball"></div>


<!-- GUÍA -->

<div id="aim"></div>


<!-- OBJETIVO -->

<div id="mission">
GOLES: 0 / 3
</div>


<!-- CONTROLES -->

<div id="controls">

<div
class="control"
id="left">
◀
</div>

<div
class="control shoot"
id="shoot">
⚽
<br>
DISPARAR
</div>

<div
class="control"
id="right">
▶
</div>

</div>


<!-- MENÚ -->

<div id="menu">

<div class="card">

<h1>
⚽ FOOTBALL
<br>
CHALLENGE
</h1>

<p>
Supera los niveles,
marca goles y vence
al portero.
</p>

<button id="play">
JUGAR
</button>

</div>

</div>


<!-- MENSAJE -->

<div id="message">

<div class="messageBox">

<h2 id="messageTitle">
¡GOL!
</h2>

<p id="messageText">
</p>

<button id="continue">
CONTINUAR
</button>

</div>

</div>

</div>


<script>


/* =========================
   VARIABLES
========================= */

let level=1;

let goals=0;

let rivalGoals=0;

let targetGoals=3;

let goalkeeperSpeed=2;

let shooting=false;

let ballMoving=false;

let ballX=50;

let keeperX=50;

let playerX=50;


/* =========================
   ELEMENTOS
========================= */

const player=
document.getElementById(
"player"
);

const ball=
document.getElementById(
"ball"
);

const goalkeeper=
document.getElementById(
"goalkeeper"
);

const aim=
document.getElementById(
"aim"
);

const score=
document.getElementById(
"score"
);

const levelText=
document.getElementById(
"level"
);

const mission=
document.getElementById(
"mission"
);

const menu=
document.getElementById(
"menu"
);

const message=
document.getElementById(
"message"
);

const messageTitle=
document.getElementById(
"messageTitle"
);

const messageText=
document.getElementById(
"messageText"
);


/* =========================
   INICIAR
========================= */

document
.getElementById("play")
.addEventListener(
"click",
startGame
);


function startGame(){

    level=1;

    goals=0;

    rivalGoals=0;

    targetGoals=3;

    goalkeeperSpeed=2;

    menu.style.display=
    "none";

    resetLevel();

}


/* =========================
   REINICIAR NIVEL
========================= */

function resetLevel(){

    ballMoving=false;

    shooting=false;

    playerX=50;

    ballX=50;

    keeperX=50;

    player.style.left=
    playerX+"%";

    ball.style.left=
    ballX+"%";

    ball.style.bottom=
    "17%";

    goalkeeper.style.left=
    keeperX+"%";

    targetGoals=
    2+level;

    goalkeeperSpeed=
    1.5+
    level*.8;

    updateHUD();

}


/* =========================
   HUD
========================= */

function updateHUD(){

    score.textContent=
    goals+" - "+rivalGoals;

    levelText.textContent=
    "NIVEL "+level;

    mission.textContent=
    "GOLES: "+
    goals+
    " / "+
    targetGoals;
}


/* =========================
   MOVER JUGADOR
========================= */

function movePlayer(direction){

    if(ballMoving)
        return;

    playerX +=
    direction*5;

    playerX=
    Math.max(
        15,
        Math.min(
            85,
            playerX
        )
    );

    player.style.left=
    playerX+"%";

    ballX=playerX;

    ball.style.left=
    ballX+"%";

}


/* =========================
   BOTONES
========================= */

document
.getElementById("left")
.addEventListener(
"touchstart",
e=>{
    e.preventDefault();
    movePlayer(-1);
}
);

document
.getElementById("right")
.addEventListener(
"touchstart",
e=>{
    e.preventDefault();
    movePlayer(1);
}
);


/* =========================
   DISPARO
========================= */

document
.getElementById("shoot")
.addEventListener(
"touchstart",
e=>{

    e.preventDefault();

    shootBall();

}
);


/* TAMBIÉN PC */

document
.getElementById("shoot")
.addEventListener(
"mousedown",
shootBall
);


/* =========================
   DISPARAR
========================= */

function shootBall(){

    if(ballMoving)
        return;

    ballMoving=true;

    shooting=true;

    let targetX=
    keeperX;

    /*
    El jugador puede apuntar
    ligeramente hacia los lados.
    */

    let direction=
    playerX <
    keeperX
    ? -1
    : 1;

    /*
    Probabilidad de que
    el balón pase el portero.
    */

    let accuracy=
    Math.random();

    let goesIn=
    accuracy >
    0.35;


    animateBall(
    goesIn
    );

}


/* =========================
   ANIMAR BALÓN
========================= */

function animateBall(goesIn){

    let start=17;

    let end=65;

    let progress=0;

    let interval=
    setInterval(()=>{

        progress+=0.05;

        let bottom=
        start+
        (end-start)*
        progress;

        ball.style.bottom=
        bottom+"%";


        if(progress>=1){

            clearInterval(
            interval
            );

            ballMoving=false;

            if(goesIn){

                scoreGoal();

            }else{

                goalkeeperSave();

            }

        }

    },30);

}


/* =========================
   GOL
========================= */

function scoreGoal(){

    goals++;

    updateHUD();

    messageTitle.textContent=
    "⚽ ¡GOOOOOOL!";

    messageText.textContent=
    "Has marcado. "+
    goals+
    " de "+
    targetGoals+
    " goles.";

    message.style.display=
    "flex";


    if(goals>=targetGoals){

        messageTitle.textContent=
        "🏆 ¡NIVEL COMPLETADO!";

        messageText.textContent=
        "Prepárate para el nivel "+
        (level+1)+".";
    }

}


/* =========================
   ATAJADA
========================= */

function goalkeeperSave(){

    messageTitle.textContent=
    "🧤 ¡ATAJÓ!";

    messageText.textContent=
    "El portero detuvo tu disparo.";

    message.style.display=
    "flex";


    /*
    El rival tiene una pequeña
    posibilidad de marcar.
    */

    if(
    Math.random()<
    0.25
    ){

        rivalGoals++;

        updateHUD();

    }

}


/* =========================
   CONTINUAR
========================= */

document
.getElementById("continue")
.addEventListener(
"click",
()=>{

    message.style.display=
    "none";


    if(
    goals>=targetGoals
    ){

        level++;

        /*
        Aumentamos dificultad.
        */

        targetGoals=
        level+2;

        goalkeeperSpeed+=
        .8;

        resetLevel();

    }else{

        resetBall();

    }

});


/* =========================
   REINICIAR BALÓN
========================= */

function resetBall(){

    ball.style.bottom=
    "17%";

    ball.style.left=
    playerX+"%";

    ballX=playerX;

}


/* =========================
   MOVER PORTERO
========================= */

function moveGoalkeeper(){

    if(!ballMoving)
        return;


    /*
    El portero se mueve
    intentando seguir el balón.
    */

    if(
    ballX>
    keeperX
    ){

        keeperX+=
        goalkeeperSpeed;

    }else{

        keeperX-=
        goalkeeperSpeed;

    }


    keeperX=
    Math.max(
        25,
        Math.min(
            75,
            keeperX
        )
    );


    goalkeeper.style.left=
    keeperX+"%";


    requestAnimationFrame(
    moveGoalkeeper
    );

}


/* =========================
   LOOP PORTERO
========================= */

setInterval(
()=>{

    if(ballMoving){

        moveGoalkeeper();

    }

},
50
);


/* =========================
   CONTROL POR ARRASTRE
========================= */

let dragging=false;

document
.getElementById("game")
.addEventListener(
"touchmove",
e=>{

    if(ballMoving)
        return;

    const touch=
    e.touches[0];

    const rect=
    document
    .getElementById("game")
    .getBoundingClientRect();

    let percent=
    (
        (touch.clientX-
        rect.left)/
        rect.width
    )*100;


    playerX=
    Math.max(
        15,
        Math.min(
            85,
            percent
        )
    );


    ballX=playerX;

    player.style.left=
    playerX+"%";

    ball.style.left=
    ballX+"%";

},
{
    passive:false
}
);


/* =========================
   TECLADO
========================= */

document
.addEventListener(
"keydown",
e=>{

    if(e.key==="ArrowLeft")
        movePlayer(-1);

    if(e.key==="ArrowRight")
        movePlayer(1);

    if(e.code==="Space")
        shootBall();

});


</script>

</body>

</html>
